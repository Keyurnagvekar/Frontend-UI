apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-control-center-client
  labels:
    app: mcp-control-center-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-control-center-client
  template:
    metadata:
      labels:
        app: mcp-control-center-client
    spec:
      containers:
        - name: client
          image: YOUR_REGISTRY/mcp-control-center-client:0.1.0
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-control-center-client
spec:
  selector:
    app: mcp-control-center-client
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
